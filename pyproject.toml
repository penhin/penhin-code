[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penhin-code"
version = "0.1.1"
description = "面向本地开发的轻量 coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "coding-agent", "cli", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "anthropic>=0.25.0",
  "google-genai>=1.0.0",
  "filelock>=3.15.0",
  "httpx>=0.27.0",
  "keyring>=25.0.0",
  "openai>=1.0.0",
  "prompt_toolkit>=3.0.52",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2.0"]

[project.scripts]
penhin = "penhin.cli.main:main"
penhin-eval = "penhin.evaluation.cli:main"

[project.urls]
Homepage = "https://github.com/penhin/penhin-code"
Repository = "https://github.com/penhin/penhin-code.git"
Issues = "https://github.com/penhin/penhin-code/issues"
Changelog = "https://github.com/penhin/penhin-code/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["penhin*"]

[tool.setuptools.package-data]
"penhin.evaluation" = [
  "suites/**/*.yaml",
  "suites/**/fixtures/**/*.py",
  "suites/**/fixtures/**/*.md",
  "suites/**/fixtures/**/*.js",
  "suites/**/fixtures/**/*.json",
  "suites/**/fixtures/**/*.go",
  "suites/**/fixtures/**/go.mod",
]
