schema_version: penhin.eval.suite/v1
cases:
  - schema_version: penhin.eval.case/v1
    id: main-explore-architecture
    layer: main
    category: exploration
    prompt: Inspect this repository and explain its modules and data flow. Do not modify files.
    fixture: fixtures/python-mini
    timeout_seconds: 180
    allowed_paths: [__no_changes__]
    expected_tools: [list, read]
    rubric: The explanation should accurately connect calculator, text utilities, inventory, and tests.
  - schema_version: penhin.eval.case/v1
    id: main-explore-bug
    layer: main
    category: exploration
    prompt: Locate the intentional arithmetic bug and explain the exact correction. Do not modify files.
    fixture: fixtures/python-mini
    timeout_seconds: 180
    allowed_paths: [__no_changes__]
    expected_tools: [search, read]
    rubric: Identify subtract and explain that it must use subtraction.
  - schema_version: penhin.eval.case/v1
    id: main-explore-tests
    layer: main
    category: exploration
    prompt: Review the tests and identify important untested behavior. Do not modify files.
    fixture: fixtures/python-mini
    timeout_seconds: 180
    allowed_paths: [__no_changes__]
    expected_tools: [read]
    rubric: Mention subtract, word_count edge cases, and invalid inventory quantities where appropriate.
  - schema_version: penhin.eval.case/v1
    id: main-explore-api
    layer: main
    category: exploration
    prompt: Produce a concise API inventory of public functions and methods. Do not modify files.
    fixture: fixtures/python-mini
    timeout_seconds: 180
    allowed_paths: [__no_changes__]
    expected_tools: [search, read]
    rubric: Cover every public callable without inventing APIs.
  - schema_version: penhin.eval.case/v1
    id: main-implement-subtract
    layer: main
    category: implementation
    prompt: Fix the subtract function and add a regression test.
    fixture: fixtures/python-mini
    timeout_seconds: 240
    allowed_paths: [calculator.py, test_project.py]
    content_checks: [{path: calculator.py, contains: "return left - right"}]
    commands: [{command: [python3, -m, unittest, -q]}]
    expected_tools: [read, edit, bash]
    rubric: Make the smallest correct change and add meaningful regression coverage.
  - schema_version: penhin.eval.case/v1
    id: main-implement-divide
    layer: main
    category: implementation
    prompt: Add a divide function that raises ValueError for a zero divisor, with tests.
    fixture: fixtures/python-mini
    timeout_seconds: 240
    allowed_paths: [calculator.py, test_project.py]
    content_checks: [{path: calculator.py, contains: "def divide"}]
    commands: [{command: [python3, -m, unittest, -q]}]
    expected_tools: [read, edit, bash]
    rubric: Handle zero explicitly and preserve existing behavior.
  - schema_version: penhin.eval.case/v1
    id: main-implement-average
    layer: main
    category: implementation
    prompt: Add an average(values) helper that rejects an empty input, with tests.
    fixture: fixtures/python-mini
    timeout_seconds: 240
    allowed_paths: [calculator.py, test_project.py]
    content_checks: [{path: calculator.py, contains: "def average"}]
    commands: [{command: [python3, -m, unittest, -q]}]
    expected_tools: [read, edit, bash]
    rubric: Correctly support general iterables or clearly document accepted input.
  - schema_version: penhin.eval.case/v1
    id: main-implement-slugify
    layer: main
    category: implementation
    prompt: Add a slugify function to text_utils that normalizes spaces to hyphens, with tests.
    fixture: fixtures/python-mini
    timeout_seconds: 240
    allowed_paths: [text_utils.py, test_project.py]
    content_checks: [{path: text_utils.py, contains: "def slugify"}]
    commands: [{command: [python3, -m, unittest, -q]}]
    expected_tools: [read, edit, bash]
    rubric: Reuse normalization behavior and test whitespace and casing.
  - schema_version: penhin.eval.case/v1
    id: main-implement-word-count
    layer: main
    category: implementation
    prompt: Fix word_count so empty and repeated whitespace are handled correctly, and add tests.
    fixture: fixtures/python-mini
    timeout_seconds: 240
    allowed_paths: [text_utils.py, test_project.py]
    content_checks: [{path: text_utils.py, contains: "split()"}]
    commands: [{command: [python3, -m, unittest, -q]}]
    expected_tools: [read, edit, bash]
    rubric: Empty input should count as zero and arbitrary whitespace should be handled.
  - schema_version: penhin.eval.case/v1
