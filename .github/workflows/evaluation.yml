name: Agent Evaluation

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions per baseline-v1 case
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - name: Validate offline suite
        run: penhin-eval validate --suite baseline-v1
      - name: Run real evaluation
        env:
          LLM_PROVIDER: ${{ vars.PENHIN_EVAL_PRIMARY_PROVIDER }}
          MODEL_ID: ${{ vars.PENHIN_EVAL_PRIMARY_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PENHIN_EVAL_JUDGE_PROVIDER: gemini
          PENHIN_EVAL_JUDGE_MODEL: ${{ vars.PENHIN_EVAL_JUDGE_MODEL }}
          PENHIN_EVAL_PRIMARY_INPUT_USD_PER_MTOK: ${{ vars.PENHIN_EVAL_PRIMARY_INPUT_USD_PER_MTOK }}
          PENHIN_EVAL_PRIMARY_OUTPUT_USD_PER_MTOK: ${{ vars.PENHIN_EVAL_PRIMARY_OUTPUT_USD_PER_MTOK }}
          PENHIN_EVAL_JUDGE_INPUT_USD_PER_MTOK: ${{ vars.PENHIN_EVAL_JUDGE_INPUT_USD_PER_MTOK }}
          PENHIN_EVAL_JUDGE_OUTPUT_USD_PER_MTOK: ${{ vars.PENHIN_EVAL_JUDGE_OUTPUT_USD_PER_MTOK }}
          PENHIN_EVAL_MAX_TOTAL_TOKENS: "6000000"
          PENHIN_EVAL_MAX_USD: "30"
        run: penhin-eval run --suite baseline-v1 --repetitions "${{ inputs.repetitions }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: penhin-evaluation
          path: .benchmarks/runs/
